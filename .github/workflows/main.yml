name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.9
        uses: actions/setup-python@v3
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (example)
        run: |
          # Add your test command here, e.g., pytest
          python -m unittest discover -s tests -p "test*.py"

      - name: Build Docker image
        run: docker build -t my-app .

      - name: Log in to Docker Hub
        run: |
          docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker tag my-app:latest ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest

      - name: Deploy to Kubernetes (example - requires kubectl access)
        # This step requires you to configure kubectl to access your Kubernetes cluster.
        # You can use a service account token or other authentication methods.
        # This is just a placeholder, adapt it to your specific deployment strategy.
        run: |
          echo "Deploying to Kubernetes..."
