apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-repo-deployment
  labels:
    app: test-repo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-repo
  template:
    metadata:
      labels:
        app: test-repo
    spec:
      containers:
      - name: test-repo
        image: test-repo:latest # Replace with your actual image
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080 # Or the port your application uses
        resources:
          limits:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: / # Or an appropriate health check endpoint
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 3
        readinessProbe:
          httpGet:
            path: / # Or an appropriate health check endpoint
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: test-repo-service
spec:
  selector:
    app: test-repo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080 # Or the port your application uses
  type: ClusterIP